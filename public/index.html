<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Uczestnika — Grand Hotel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    if (window.location.hostname.startsWith('admin.')) {
      window.location.replace('/admin.html');
    }
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: { brand: { 50: '#f0f9ff', 100: '#e0f2fe', 600: '#0284c7', 900: '#0c4a6e' } }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- Ekran Logowania -->
  <div id="login-view" class="flex-1 flex flex-col justify-center items-center p-4">
    <div class="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md border border-slate-100 text-center">
      <div class="w-16 h-16 bg-brand-50 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-6 shadow-inner">
        <i data-lucide="hotel" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-900 mb-2">Grand Hotel PMS</h1>
      <p class="text-slate-500 mb-8 text-sm">Wprowadź swój token dostępu, aby zarządzać statusem pokoju.</p>
      
      <div class="space-y-4">
        <div class="relative">
          <i data-lucide="key" class="absolute left-3 top-3 text-slate-400 w-5 h-5"></i>
          <input type="text" id="token-input" placeholder="np. wk-1001-a1b2c3" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand-600 focus:bg-white transition-all text-sm font-medium">
        </div>
        <button onclick="login()" class="w-full bg-slate-900 text-white font-semibold py-3 rounded-xl hover:bg-slate-800 shadow-md hover:shadow-lg transition-all flex items-center justify-center gap-2">
          <span>Wejdź do panelu</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Panel Główny -->
  <div id="dashboard-view" class="hidden flex-1 flex flex-col">
    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
      <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <div class="bg-brand-600 text-white p-2 rounded-lg shadow-sm">
              <i data-lucide="building-2" class="w-5 h-5"></i>
            </div>
            <span class="font-bold text-lg text-slate-900 tracking-tight">Grand Hotel</span>
          </div>
          <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
              <div class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse"></div>
              <span class="text-sm font-semibold text-slate-700">Pokój <span id="room-number" class="text-brand-600"></span></span>
            </div>
            <button onclick="logout()" class="text-slate-400 hover:text-slate-600 transition-colors p-2 rounded-lg hover:bg-slate-50" title="Wyloguj">
              <i data-lucide="log-out" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
      
      <div class="flex justify-between items-end mb-8">
        <div>
          <h2 class="text-2xl font-bold text-slate-900">Pulpit pokoju</h2>
          <p class="text-slate-500 text-sm mt-1">Monitoruj na żywo status swoich zgłoszeń i prośb.</p>
        </div>
        <button onclick="fetchData()" class="flex items-center gap-2 bg-white border border-slate-200 text-slate-700 px-4 py-2 rounded-lg text-sm font-medium hover:bg-slate-50 hover:shadow-sm transition-all group">
          <i data-lucide="refresh-cw" class="w-4 h-4 text-slate-400 group-hover:text-brand-600 group-hover:rotate-180 transition-all duration-500"></i>
          Odśwież
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Maintenance Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
          <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex items-center gap-3">
            <div class="p-2 bg-orange-100 text-orange-600 rounded-lg">
              <i data-lucide="wrench" class="w-5 h-5"></i>
            </div>
            <h3 class="font-semibold text-slate-800">Usterki (Maintenance)</h3>
          </div>
          <div class="p-6" id="maintenance-content">
            <!-- Content via JS -->
            <div class="flex flex-col items-center justify-center py-8 text-slate-400">
              <i data-lucide="check-circle-2" class="w-10 h-10 mb-3 opacity-20"></i>
              <p class="text-sm font-medium">Brak aktywnych zgłoszeń.</p>
            </div>
          </div>
        </div>

        <!-- Housekeeping Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-shadow">
          <div class="px-6 py-4 border-b border-slate-100 bg-slate-50/50 flex items-center gap-3">
            <div class="p-2 bg-blue-100 text-blue-600 rounded-lg">
              <i data-lucide="sparkles" class="w-5 h-5"></i>
            </div>
            <h3 class="font-semibold text-slate-800">Sprzątanie (Housekeeping)</h3>
          </div>
          <div class="p-6" id="housekeeping-content">
            <!-- Content via JS -->
            <div class="flex flex-col items-center justify-center py-8 text-slate-400">
              <i data-lucide="wind" class="w-10 h-10 mb-3 opacity-20"></i>
              <p class="text-sm font-medium">Brak próśb o sprzątanie.</p>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script>
    lucide.createIcons();

    const loginView = document.getElementById('login-view');
    const dashboardView = document.getElementById('dashboard-view');
    let currentToken = localStorage.getItem('hotel_token');

    async function checkSubdomainAuth() {
      try {
        const res = await fetch('/api/auth/context');
        const data = await res.json();
        
        if (data.token) {
          currentToken = data.token;
          localStorage.setItem('hotel_token', data.token);
          showDashboard();
          return true;
        }
      } catch(e) {}
      return false;
    }

    (async function init() {
      const autoLogged = await checkSubdomainAuth();
      if (!autoLogged && currentToken) {
        showDashboard();
      }
    })();

    function login() {
      const token = document.getElementById('token-input').value.trim();
      if (!token) return alert('Podaj token!');
      localStorage.setItem('hotel_token', token);
      currentToken = token;
      showDashboard();
    }

    function logout() {
      localStorage.removeItem('hotel_token');
      currentToken = null;
      dashboardView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }

    function showDashboard() {
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      fetchData();
    }

    function getStatusBadge(status) {
      const badges = {
        'open': '<span class="px-2.5 py-1 bg-amber-100 text-amber-700 border border-amber-200 rounded-full text-xs font-semibold flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Oczekujące</span>',
        'pending': '<span class="px-2.5 py-1 bg-amber-100 text-amber-700 border border-amber-200 rounded-full text-xs font-semibold flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-amber-500"></span>Oczekujące</span>',
        'in_progress': '<span class="px-2.5 py-1 bg-blue-100 text-blue-700 border border-blue-200 rounded-full text-xs font-semibold flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-blue-500 animate-pulse"></span>W realizacji</span>',
        'resolved': '<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-full text-xs font-semibold flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Zakończone</span>',
        'completed': '<span class="px-2.5 py-1 bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-full text-xs font-semibold flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>Zakończone</span>'
      };
      return badges[status] || `<span class="px-2.5 py-1 bg-slate-100 text-slate-700 border border-slate-200 rounded-full text-xs font-semibold">${status}</span>`;
    }

    async function fetchData() {
      try {
        // --- Fetch Maintenance ---
        const resM = await fetch('/api/agent/maintenance/status', {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        
        if (resM.status === 401) {
          alert('Nieważny token.');
          return logout();
        }

        const dataM = await resM.json();
        
        const roomMatch = currentToken.match(/wk-(\d+)-/);
        if (roomMatch) document.getElementById('room-number').innerText = roomMatch[1];

        const mContent = document.getElementById('maintenance-content');
        if (dataM.has_active_tickets) {
          const t = dataM.ticket;
          mContent.innerHTML = `
            <div class="bg-white p-4 border border-slate-100 rounded-xl shadow-sm relative overflow-hidden">
              <div class="absolute top-0 left-0 w-1 h-full bg-orange-500"></div>
              <div class="flex justify-between items-start mb-3">
                <div class="text-xs font-mono text-slate-400 bg-slate-50 px-2 py-1 rounded">${t.id}</div>
                ${getStatusBadge(t.status)}
              </div>
              <div class="font-medium text-slate-800 mb-1 flex items-center gap-2">
                <i data-lucide="tag" class="w-4 h-4 text-slate-400"></i>
                <span class="capitalize">${t.category}</span>
              </div>
              <div class="text-sm text-slate-600 mb-4 bg-slate-50 p-3 rounded-lg border border-slate-100">${t.description || 'Brak opisu'}</div>
              <div class="text-xs text-slate-400 flex items-center gap-1.5">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> Zgłoszono: ${new Date(t.created_at).toLocaleString('pl-PL', {dateStyle:'short', timeStyle:'short'})}
              </div>
            </div>`;
        } else {
          mContent.innerHTML = `<div class="flex flex-col items-center justify-center py-8 text-slate-400"><i data-lucide="check-circle-2" class="w-10 h-10 mb-3 opacity-20"></i><p class="text-sm font-medium">Brak aktywnych zgłoszeń.</p></div>`;
        }

        // --- Fetch Housekeeping ---
        const resH = await fetch('/api/agent/housekeeping/status', {
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        const dataH = await resH.json();
        const hContent = document.getElementById('housekeeping-content');
        
        if (dataH.has_active_requests) {
          const t = dataH.ticket;
          hContent.innerHTML = `
            <div class="bg-white p-4 border border-slate-100 rounded-xl shadow-sm relative overflow-hidden">
              <div class="absolute top-0 left-0 w-1 h-full bg-blue-500"></div>
              <div class="flex justify-between items-start mb-3">
                <div class="text-xs font-mono text-slate-400 bg-slate-50 px-2 py-1 rounded">${t.id}</div>
                ${getStatusBadge(t.status)}
              </div>
              <div class="font-medium text-slate-800 mb-1 flex items-center gap-2">
                <i data-lucide="list" class="w-4 h-4 text-slate-400"></i>
                Żądane przedmioty:
              </div>
              <div class="text-sm text-slate-600 mb-4 bg-slate-50 p-3 rounded-lg border border-slate-100 font-mono">${t.items}</div>
              <div class="text-xs text-slate-400 flex items-center gap-1.5">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i> ETA: ~${t.eta_minutes} min
              </div>
            </div>`;
        } else {
          hContent.innerHTML = `<div class="flex flex-col items-center justify-center py-8 text-slate-400"><i data-lucide="wind" class="w-10 h-10 mb-3 opacity-20"></i><p class="text-sm font-medium">Brak próśb o sprzątanie.</p></div>`;
        }

        lucide.createIcons();
      } catch (err) {
        console.error('Błąd pobierania danych', err);
      }
    }
  </script>
</body>
</html>
